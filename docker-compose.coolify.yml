services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_80
      - BASE_URL=${SERVICE_URL_APP_80}
      - BASE_URL_PORT=80
      - BOT_TOKEN=${BOT_TOKEN:?}
      - OWNER_ID=${OWNER_ID:?}
      - TELEGRAM_API=${TELEGRAM_API:?}
      - TELEGRAM_HASH=${TELEGRAM_HASH:?}
      - DEFAULT_UPLOAD=${DEFAULT_UPLOAD:-rc}
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH:-/app/downloads/storage}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_NAME=${DATABASE_NAME:-mltb}
      - UPSTREAM_REPO=${UPSTREAM_REPO:-}
      - UPSTREAM_BRANCH=${UPSTREAM_BRANCH:-master}
    volumes:
      - mltb-downloads:/app/downloads

volumes:
  mltb-downloads:
